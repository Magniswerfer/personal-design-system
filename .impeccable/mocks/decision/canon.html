<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#0f1115;font-family:Inter,sans-serif}
header{height:60px;border-bottom:1px solid #eef0f3;display:flex;align-items:center;padding:0 24px;gap:24px;font-size:14px}
header b{font-weight:600;margin-right:auto}
.search{width:280px;height:34px;border:1px solid #e3e6ea;border-radius:8px}
aside{position:absolute;top:60px;left:0;width:260px;bottom:0;border-right:1px solid #eef0f3;padding:24px;font-size:14px;line-height:2.1;color:#555}
aside .h{color:#0f1115;font-weight:600;margin-top:12px}aside .on{color:#3b5bdb;font-weight:500}
main{margin-left:300px;padding:40px;max-width:820px}
h1{font-size:36px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
p{font-size:16px;line-height:1.6;color:#444}
.prev{margin-top:32px;border:1px solid #eef0f3;border-radius:12px;height:200px;display:flex;align-items:center;justify-content:center;gap:12px}
.b{padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid #e3e6ea}.b.p{background:#3b5bdb;color:#fff;border-color:#3b5bdb}
pre{background:#0f1115;color:#e6e6e6;font-family:"JetBrains Mono";font-size:13px;padding:16px;border-radius:0 0 12px 12px}
</style></head><body>
<header><b>Design System</b><span>Docs</span><span>Components</span><span>MCP</span><div class="search"></div></header>
<aside><div class="h">Getting started</div><div>Introduction</div><div>Installation</div><div class="h">Components</div><div class="on">Button</div><div>Field</div><div>Table</div><div>Callout</div></aside>
<main><h1>Button</h1><p>Buttons trigger an action. Use the primary variant for the main action on a surface.</p>
<div class="prev"><span class="b p">Save entry</span><span class="b">Cancel</span></div>
<pre>&lt;button class="btn btn-primary"&gt;Save entry&lt;/button&gt;</pre></main>
